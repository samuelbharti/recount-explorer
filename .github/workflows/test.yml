name: test

# This is the expensive workflow. It installs about ninety Bioconductor
# packages, so it runs only on the way into main, which means the dev to main
# pull request. Feature branches get the lint workflow and the local prek
# hooks. Use the manual trigger when a feature branch needs a full test run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # Linux only. Windows runners bill at twice the rate of Linux runners, and
    # the logic layer under test has no platform specific code.
    runs-on: ubuntu-latest
    # Dependabot here only bumps GitHub Actions versions in workflow YAML, so
    # a ninety-package Bioconductor install and test run has nothing to check.
    # Manual dispatch is unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Dependencies come from DESCRIPTION rather than renv.lock. Restoring
      # about ninety Bioconductor packages from source is slow and brittle.
      # DESCRIPTION plus PPM binaries is neither. The biocViews field is what
      # enables the Bioconductor repositories. Without it recount3 fails.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run tests
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
