name: lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: air format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check

  lint:
    name: lintr
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # lintr only, deliberately not the app's Bioconductor dependencies: a
      # static lint does not need recount3 installed, and skipping it keeps
      # this job at a couple of minutes instead of twenty.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
          dependencies: '"none"'

      - name: Lint
        run: lintr::lint_dir(".")
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
