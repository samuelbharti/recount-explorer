name: lint

# Actions minutes are metered on this private repository, so this workflow is
# deliberately small. There is no push trigger: a push to a branch with an open
# pull request would bill a second run for the same commit. Formatting and
# linting also run locally through the prek hooks, so this job is a backstop.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # air and lintr share one job on purpose. GitHub bills each job a one minute
  # minimum, so two jobs of forty seconds cost twice as much as one job of
  # eighty seconds.
  lint:
    name: lint
    runs-on: ubuntu-latest
    # Dependabot here only bumps GitHub Actions versions in workflow YAML, so
    # there is no R code to lint or format. Skip the run rather than bill a
    # minute for nothing. Manual dispatch is unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # lintr on its own, with no Bioconductor packages. A static lint does not
      # need recount3 installed, and skipping it keeps this job near a minute.
      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}

      - name: Lint
        run: lintr::lint_dir(".")
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
