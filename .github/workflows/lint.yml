name: lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: air format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check

  lint:
    name: lintr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install lintr on its own rather than through setup-r-dependencies. A
      # static lint does not need recount3, and skipping the Bioconductor
      # install keeps this job at about two minutes.
      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}

      - name: Lint
        run: lintr::lint_dir(".")
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
