name: lint

# Actions minutes are metered on this private repository, so this workflow is
# deliberately small. There is no push trigger: a push to a branch with an open
# pull request would bill a second run for the same commit. Formatting and
# linting also run locally through the prek hooks, so this job is a backstop.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # air and lintr share one job on purpose. GitHub bills each job a one minute
  # minimum, so two jobs of forty seconds cost twice as much as one job of
  # eighty seconds.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # lintr on its own, with no Bioconductor packages. A static lint does not
      # need recount3 installed, and skipping it keeps this job near a minute.
      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}

      - name: Lint
        run: lintr::lint_dir(".")
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      # The front end checks live in this job rather than their own. GitHub
      # bills a one minute minimum for each job, and these steps add about
      # forty seconds to a job that is already running.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install front end dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # www/app.js and www/style.css are committed so a clone runs with
      # shiny::runApp() and nothing else. Rebuilding here catches the case
      # where someone edits src/ and forgets to build.
      - name: Rebuild and check the bundle is current
        run: |
          npm run build
          git diff --exit-code -- www/             || (echo "::error::www/ is stale. Run npm run build and commit."; exit 1)
